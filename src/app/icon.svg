<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Coredex symbol gradient: purple 0%, blue 45%, cyan 85%, bottom-left to top-right -->
    <linearGradient id="g" x1="0" y1="32" x2="32" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9824F8"/>
      <stop offset="0.45" stop-color="#326BDD"/>
      <stop offset="0.85" stop-color="#3DBBD1"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2">
    <rect x="7" y="7" width="7" height="7" rx="1.5"/>
    <rect x="18" y="7" width="7" height="7" rx="1.5"/>
    <rect x="7" y="18" width="7" height="7" rx="1.5"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="18" y="18" width="3" height="3" rx="0.5"/>
    <rect x="22" y="22" width="3" height="3" rx="0.5"/>
    <rect x="22" y="18" width="3" height="3" rx="0.5" opacity="0.6"/>
    <rect x="18" y="22" width="3" height="3" rx="0.5" opacity="0.6"/>
  </g>
</svg>
