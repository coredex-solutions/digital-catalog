# nginx site for Coredex. Copy to /etc/nginx/sites-available/coredex, replace
# example.com with your domain, enable it, then run certbot to add HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Image uploads are capped at 2 MB by the app; leave headroom for the form data
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The rate limiter reads X-Real-IP; overwrite it so clients cannot fake their address
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Nf-Client-Connection-Ip "";

        proxy_read_timeout 60s;
    }
}
